<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ShuangYuu 的项目页面导航。">
  <meta name="theme-color" content="#080d18">
  <title>ShuangYuu · 项目导航</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="ambient" aria-hidden="true"></div>
  <header class="header">
    <div class="nav-inner">
      <a class="brand" href="./" aria-label="ShuangYuu 首页"><span class="brand-mark" aria-hidden="true">S<span>Y</span></span>ShuangYuu<span class="brand-dot">.</span></a>
      <nav aria-label="主导航">
        <a class="nav-projects" href="#projects">MC Mod</a>
        <button id="motion-toggle" type="button" aria-pressed="false" aria-label="暂停动效">动效：开</button>
        <a class="github-link" href="https://github.com/ShuangYuu" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>
  <main id="main" class="workspace">
    <h1 class="sr-only">ShuangYuu 项目导航</h1>
    <section id="projects" class="column" aria-labelledby="projects-title">
      <div class="column-heading"><h2 id="projects-title"><span class="heading-marker" aria-hidden="true"></span>MC Mod</h2><span id="project-count" class="count">00</span></div>
      <div id="project-list" class="project-list" aria-live="polite">
        <article class="empty-panel panel">
          <div class="panel-corner" aria-hidden="true"></div>
          <div class="orbital-scene" aria-hidden="true"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="orbit orbit-three"></div><div class="core"><span></span></div><div class="orbital-floor"></div></div>
          <div class="empty-copy"><span class="status"><i aria-hidden="true"></i>等待发布</span><h3>暂无模组页面</h3><p>模组页面发布后，将在这里展示。</p></div>
        </article>
      </div>
      <noscript><p class="noscript-note">启用 JavaScript 后可加载MC Mod列表。</p></noscript>
    </section>
    <aside class="column secondary" aria-labelledby="reserved-title">
      <div class="column-heading"><h2 id="reserved-title"><span class="heading-marker muted" aria-hidden="true"></span>其他仓库</h2><span class="count">03</span></div>
      <div class="project-list">
        <a class="project-card panel" href="https://github.com/ShuangYuu/SYLibrary-back" target="_blank" rel="noopener noreferrer"><span class="project-label">JAVA / BACKEND</span><span class="project-arrow" aria-hidden="true">↗</span><h3>SYLibrary-back</h3><p>图书项目的后端实现</p></a>
        <a class="project-card panel" href="https://github.com/ShuangYuu/SYLibrary-web" target="_blank" rel="noopener noreferrer"><span class="project-label">VUE / WEB</span><span class="project-arrow" aria-hidden="true">↗</span><h3>SYLibrary-web</h3><p>图书项目的 Web 端实现</p></a>
        <a class="project-card panel" href="https://github.com/ShuangYuu/SYLibrary-uniapp" target="_blank" rel="noopener noreferrer"><span class="project-label">VUE / APP</span><span class="project-arrow" aria-hidden="true">↗</span><h3>SYLibrary-uniapp</h3><p>图书项目的 App 端实现</p></a>
      </div>
    </aside>
  </main>
  <footer>© ShuangYuu</footer>
</body>
</html>
